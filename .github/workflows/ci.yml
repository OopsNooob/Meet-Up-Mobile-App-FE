name: CI - Code Quality (TSC & Lint)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - '**'
  pull_request:
    branches:
      - main
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: TypeScript & ESLint Check
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🟢 Setup Node.js 20 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Run TypeScript check (tsc)
        run: pnpm typecheck

      - name: 🧹 Run ESLint (expo lint)
        run: pnpm lint
